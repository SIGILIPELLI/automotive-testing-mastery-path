site_name: Automotive Testing Mastery Path
site_description: A structured, module-wise training program for automotive ECU testing — CAN bus, Vector CANoe, CAPL scripting, UDS diagnostics and Hardware-in-the-Loop, entry level to master level.
site_url: https://sigilipelli.github.io/automotive-testing-skillmastery/
repo_url: https://github.com/SIGILIPELLI/automotive-testing-skillmastery
repo_name: automotive-testing-skillmastery

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

